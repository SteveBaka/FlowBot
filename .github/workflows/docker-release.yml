name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (e.g. 1.3.0). Leave empty to use docker/VERSION.'
        required: false
        type: string
      force_release:
        description: 'Force build even if this version is already fully released (main pushes only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/flowbot

jobs:
  build-electron:
    name: Build Electron App (Linux)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Version resolution + release gate (formerly the bump-version job).
      # Gate skips only when this version's release is already complete
      # (tarball uploaded); incomplete releases rebuild so failed runs can re-run.
      - name: Resolve version and release gate
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(cat docker/VERSION | tr -d '[:space:]')
          OVERRIDE="${{ inputs.version_override }}"
          NEW_VERSION="${OVERRIDE:-$CURRENT}"

          SHOULD=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ inputs.force_release }}" != "true" ]; then
            if gh release view "v$NEW_VERSION" --json assets >/dev/null 2>&1 \
               && gh release view "v$NEW_VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'flowbot-docker.tar.gz'; then
              SHOULD=false
              echo "Release v$NEW_VERSION already has flowbot-docker.tar.gz — skipping build."
            fi
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NEW_VERSION (should_build=$SHOULD)"

      - name: Install Node.js
        if: steps.version.outputs.should_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      # setup-node only caches ~/.npm; the electron dist zip (~110MB) and
      # electron-builder tooling live in these caches and would re-download every run.
      - name: Cache Electron binaries
        if: steps.version.outputs.should_build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Dependencies
        if: steps.version.outputs.should_build == 'true'
        run: npm ci

      - name: Ensure linux key helper is executable
        if: steps.version.outputs.should_build == 'true'
        shell: bash
        run: |
          [ -f "resources/key/linux/x64/xkey_helper_linux" ] && chmod +x "resources/key/linux/x64/xkey_helper_linux" || echo "File not found"

      # tsc is check-only (noEmit) and vite bundles independently — no data dependency.
      - name: Type Check & Build Frontend (parallel)
        if: steps.version.outputs.should_build == 'true'
        shell: bash
        run: |
          set -uo pipefail
          npx tsc &
          TSC_PID=$!
          npx vite build &
          VITE_PID=$!
          TSC_RC=0
          VITE_RC=0
          wait "$TSC_PID" || TSC_RC=$?
          wait "$VITE_PID" || VITE_RC=$?
          echo "tsc exit=$TSC_RC, vite exit=$VITE_RC"
          if [ "$TSC_RC" -ne 0 ] || [ "$VITE_RC" -ne 0 ]; then
            exit 1
          fi

      # --dir: only release/linux-unpacked/ is consumed by the Docker build;
      # AppImage/tar.gz targets were produced and discarded before.
      - name: Package Electron App (Linux, unpacked only)
        if: steps.version.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --linux --x64 --dir

      - name: Upload linux-unpacked artifact
        if: steps.version.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-unpacked
          path: release/linux-unpacked/
          retention-days: 1

  build-docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-electron
    if: needs.build-electron.outputs.should_build == 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download linux-unpacked artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-unpacked
          path: release/linux-unpacked/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image name
        id: image-name
        shell: bash
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${LOWER_OWNER}/flowbot" >> "$GITHUB_OUTPUT"
          echo "full=${{ env.REGISTRY }}/${LOWER_OWNER}/flowbot" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.full }}:latest
            ${{ steps.image-name.outputs.full }}:v${{ needs.build-electron.outputs.new_version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/flowbot:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/flowbot:v${{ needs.build-electron.outputs.new_version }}
          labels: |
            org.opencontainers.image.title=FlowBOT
            org.opencontainers.image.description=WeChat Linux container with OneBot v11 bridge
            org.opencontainers.image.version=${{ needs.build-electron.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-export the same image locally via the same buildx builder (layer cache
      # hit, no rebuild) instead of pulling 1.2GB back from the registry.
      - name: Load image locally for tarball export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ steps.image-name.outputs.full }}:latest
          cache-from: type=gha

      - name: Export Docker image to tarball (pigz)
        shell: bash
        run: |
          command -v pigz >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq pigz; }
          docker save "${{ steps.image-name.outputs.full }}:latest" | pigz > flowbot-docker.tar.gz
          ls -lh flowbot-docker.tar.gz

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      # Changelog: release-drafter's own $CHANGES (labelled PRs) is used when
      # available; this hybrid fills the "No changes" case — merged PRs first
      # (GitHub-native "- title (#N) by @author"), direct commits via the
      # compare API as fallback.
      - name: Generate changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.build-electron.outputs.new_version }}
        run: |
          set -euo pipefail

          PREV_TAG=$(gh release list --limit 50 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' | grep -vx "v$NEW_VERSION" | head -1 || true)
          echo "Previous release tag: ${PREV_TAG:-<none>}"

          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            PREV_DATE=$(gh release view "$PREV_TAG" --json publishedAt --jq .publishedAt)
            CHANGELOG=$(gh pr list --state merged --base main --limit 100 \
              --json number,title,author,mergedAt \
              --jq ".[] | select(.mergedAt >= \"${PREV_DATE}\") | \"- \" + .title + \" (#\" + (.number|tostring) + \") by @\" + .author.login" || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV_TAG...$GITHUB_SHA" \
                --jq '.commits[] | select((.parents | length) <= 1) | "- " + (.commit.message | split("\n")[0] | sub("^([a-zA-Z]+)(\\([^)]*\\))?:[[:space:]]*"; "")) + " (" + .sha[0:7] + ")"' || true)
            else
              CHANGELOG=$(gh api "repos/$GITHUB_REPOSITORY/commits?per_page=20" \
                --jq '.[] | "- " + (.commit.message | split("\n")[0] | sub("^([a-zA-Z]+)(\\([^)]*\\))?:[[:space:]]*"; "")) + " (" + .sha[0:7] + ")"' || true)
            fi
          fi

          [ -n "$CHANGELOG" ] || CHANGELOG="- 首次发布"
          printf '%s\n' "$CHANGELOG" > /tmp/changelog.md
          echo "--- changelog ---"
          cat /tmp/changelog.md

      - name: Draft Release
        id: release_drafter
        uses: release-drafter/release-drafter@v7
        with:
          # v7 重写版：token 必须走 with 输入（v6 的 env.GITHUB_TOKEN 传递方式已废弃）
          token: ${{ secrets.GITHUB_TOKEN }}
          config-name: release-drafter.yml
          tag: v${{ needs.build-electron.outputs.new_version }}
          version: ${{ needs.build-electron.outputs.new_version }}
          publish: true

      - name: Upload tarball to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release_drafter.outputs.tag_name }}" flowbot-docker.tar.gz --clobber

      - name: Update release body with variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.release_drafter.outputs.tag_name }}"
          WEFLOW_VERSION=$(jq -r .version package.json)
          IMAGE_REF="${{ steps.image-name.outputs.full }}:v${{ needs.build-electron.outputs.new_version }}"

          gh release view "$TAG" --json body --jq '.body' \
            | sed "s/\$WEFLOW_VERSION/${WEFLOW_VERSION}/g" \
            | sed "s|\$DATE|${{ steps.date.outputs.date }}|g" \
            | sed "s|\$COMMIT|${{ github.sha }}|g" \
            | sed "s|\$IMAGE_REF|${IMAGE_REF}|g" \
            > /tmp/release_body.md

          # Replace release-drafter's "No changes" placeholder with the hybrid changelog
          python3 -c "
          with open('/tmp/release_body.md') as f:
              body = f.read()
          with open('/tmp/changelog.md') as f:
              changelog = f.read().strip()
          body = body.replace('No changes', changelog, 1)
          with open('/tmp/release_body.md', 'w') as f:
              f.write(body)
          "

          gh release edit "$TAG" --notes-file /tmp/release_body.md
